<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isOffice }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M5 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16"></path><path d="M16 9h2a2 2 0 0 1 2 2v10"></path><path d="M3 21h18"></path><path d="M9 7h3M9 11h3M9 15h3"></path></svg></sc-if>
<sc-if value="{{ isRemote }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg></sc-if>
<sc-if value="{{ isTravel }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg></sc-if>
<sc-if value="{{ isOff }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg></sc-if>
<sc-if value="{{ isNone }}" hint-placeholder-val="{{ true }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:block"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3.3"></circle></svg></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:24,&quot;height&quot;:24},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;office&quot;,&quot;remote&quot;,&quot;travel&quot;,&quot;off&quot;,&quot;none&quot;],&quot;default&quot;:&quot;office&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status || 'none';
    return { isOffice: s === 'office', isRemote: s === 'remote', isTravel: s === 'travel', isOff: s === 'off', isNone: s === 'none' };
  }
}
</script>
</body>
</html>
