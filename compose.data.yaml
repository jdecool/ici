# Local development and isolated quality infrastructure; never expose PostgreSQL publicly.
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ici
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-provisioner-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d ici']
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.30.1
volumes:
  postgres-data:
