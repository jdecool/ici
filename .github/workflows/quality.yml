name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [check-infra, check-rust, check-frontend, test-rust, test-frontend, coverage-rust, coverage-frontend, mutation-rust, mutation-frontend, audit-rust, audit-frontend, build, e2e, e2e-https]
    steps:
      - uses: actions/checkout@v4
      - run: make ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            reports/
            frontend/coverage/
            frontend/reports/
            frontend/playwright-report/
            frontend/test-results/
  quality:
    name: quality
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
